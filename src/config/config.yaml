paths:
  images_root: "images"
  pairs_train: "assets/pairsDevTrain.txt"
  pairs_test:  "assets/pairsDevTest.txt"


train:
  seed: 0
  epochs: 200
  batch_size: 128
  dump_every: 5

split:
  val_ratio: 0.2
  target_pos_frac: 0.5
  min_val_identities: 150
  seed: 0

optim:
  optimizer: sgd

  lr: 0.01
  lr_decay_gamma: 0.99

  momentum_start: 0.5
  momentum_final: 0.9
  momentum_ramp_epochs: 20

  lr_conv: 0.01
  lr_fc: 0.01
  lr_alpha: 0.01

  weight_decay_conv: 0.0
  weight_decay_fc: 0.0
  weight_decay_alpha: 0.0

early_stop:
  enabled: true
  patience: 20
  min_delta: 0.0
  monitor: val_loss
  mode: min

transform:
  input_size: 105
  mean: 0.5
  std: 0.5

data:
  image_ext: ".jpg"
  strict_exists: true


model:
  in_channels: 1
  embedding_dim: 4096

runtime:
  num_workers: 2
  pin_memory: true
