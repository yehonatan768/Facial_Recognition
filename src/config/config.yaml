paths:
  project_root: ""
  images_root: images
  pairs_train: assets/pairsDevTrain.txt
  pairs_test: assets/pairsDevTest.txt

data:
  image_ext: .jpg
  strict_exists: true

pipeline:
  mode: advanced   # paper | advanced

transform:
  input_size: 105
  mean: 0.5
  std: 0.5

paper:
  enable_jitter: true
  jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.02

advanced:
  pre_crop_ratio: 0.90
  background_remover:
    enabled: true
    backend: torchvision_deeplabv3
    device: gpu
    threshold: 0.35
    min_fg_fraction: 0.02
    fg_black_threshold: 12
    min_gray_variance: 5.0
