paths:
  project_root: ""
  images_root: images
  pairs_train: assets/pairsDevTrain.txt
  pairs_test: assets/pairsDevTest.txt

data:
  image_ext: .jpg
  strict_exists: true

pipeline:
  mode: advanced

advanced:
  pre_crop_ratio: 0.90

  face_mask:
    center: [0.0, 0.0]
    axes: [0.75, 0.90]
    edge_softness: 0.08
    power: 1.5


paper:
  enable_jitter: true
  jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.02
