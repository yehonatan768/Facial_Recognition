# =========================
# Paths
# =========================
paths:
  project_root: ""            # auto-resolved by read_config.py
  images_root: images
  pairs_train: assets/pairsDevTrain.txt
  pairs_test: assets/pairsDevTest.txt

# =========================
# Optimization
# =========================
optim:
  lr_base: 0.01
  lr_decay: 0.995
  momentum_start: 0.5
  momentum_final: 0.9
  momentum_ramp_epochs: 30



# =========================
# Data
# =========================
data:
  image_ext: .jpg
  strict_exists: true

# =========================
# Pipeline
# =========================
pipeline:
  mode: advanced              # paper | advanced

# =========================
# Transform (shared)
# =========================
transform:
  input_size: 105
  mean: 0.5
  std: 0.5

# =========================
# Advanced pipeline (FACE MASK)
# =========================
advanced:
  pre_crop_ratio: 0.90

  face_mask:
    center: [0.0, 0.0]
    axes: [0.75, 0.90]
    edge_softness: 0.08
    power: 1.5

# =========================
# Paper pipeline (if used)
# =========================
paper:
  enable_jitter: true
  jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.02

# =========================
# Training
# =========================
train:
  seed: 42
  epochs: 200
  batch_size: 128
  dump_every: 10

# =========================
# Split strategy
# =========================
split:
  val_ratio: 0.25
  target_pos_frac: 0.50
  min_val_identities: 50
  seed: 42

# =========================
# Model
# =========================
model:
  in_channels: 1
  enforce_105: true
  embedding_dim: 4096

# =========================
# Early stopping
# =========================
early_stop:
  enabled: true
  monitor: val_loss          # val_acc | val_loss
  mode: min                 # max for acc, min for loss
  patience: 20
  min_delta: 0.0

