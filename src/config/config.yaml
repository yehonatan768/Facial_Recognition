# Paper: Koch, Zemel, Salakhutdinov (ICML 2015) "Siamese Neural Networks for One-shot Image Recognition"

seed: 42
device: "cuda"

paths:
  # Adjust to your project layout
  images_root: "images"
  pairs_train: "assets/pairsDevTrain.txt"
  pairs_val: "assets/pairsDevTest.txt"   # used as a verification/validation file

model:
  # Omniglot is 105x105, 1 channel
  input_channels: 1
  input_size: 105

  cnn:
    # Figure 4 best conv architecture (valid conv, stride=1; pooling 2x2/2 where shown)
    layers:
      - { out_channels: 64,  kernel: 10, maxpool: true }
      - { out_channels: 128, kernel: 7,  maxpool: true }
      - { out_channels: 128, kernel: 4,  maxpool: true }
      - { out_channels: 256, kernel: 4,  maxpool: false }

    fc_units: 4096   # joins after 4096 FC

  embedder:
    alpha_init: 1.0

train:
  batch_size: 128
  max_epochs: 200
  early_stop_patience: 20

  # Paper learning schedule:
  # - layer-wise eta_j in [1e-4, 1e-1]
  # - layer-wise mu_j in [0, 1]
  # - layer-wise lambda_j in [0, 0.1]
  # - eta decays by 0.99 every epoch (uniformly)
  # - momentum starts at 0.5 then increases linearly to mu_j
  #
  # The paper does NOT publish the final chosen eta_j/mu_j/lambda_j values.
  # Below we provide (a) the paper's ranges, and (b) a reproducible default
  # inside those ranges (same for all layers) unless you override per-layer.

  hyperparam_ranges:
    lr_per_layer: [1.0e-4, 1.0e-1]
    momentum_per_layer: [0.0, 1.0]
    l2_per_layer: [0.0, 0.1]

  schedule:
    lr_decay_gamma: 0.99
    momentum_start: 0.5

  # Default (reproducible) values within the allowed paper ranges.
  # You may override any layer below.
  per_layer:
    # Supported layer names used by train.py: conv1, conv2, conv3, conv4, fc, alpha
    conv1: { lr: 1.0e-2, momentum_final: 0.9, l2: 5.0e-4 }
    conv2: { lr: 1.0e-2, momentum_final: 0.9, l2: 5.0e-4 }
    conv3: { lr: 1.0e-2, momentum_final: 0.9, l2: 5.0e-4 }
    conv4: { lr: 1.0e-2, momentum_final: 0.9, l2: 5.0e-4 }
    fc:    { lr: 1.0e-2, momentum_final: 0.9, l2: 5.0e-4 }
    alpha: { lr: 1.0e-2, momentum_final: 0.9, l2: 0.0 }

  init:
    # Paper initialization
    conv_weight_std: 1.0e-2
    fc_weight_std: 2.0e-1
    bias_mean: 0.5
    bias_std: 1.0e-2

augment:
  enabled: true
  # Paper affine transform components, each included with probability 0.5
  rotation_deg: [-10.0, 10.0]
  shear_x: [-0.3, 0.3]
  shear_y: [-0.3, 0.3]
  scale_x: [0.8, 1.2]
  scale_y: [0.8, 1.2]
  translate_x_px: [-2, 2]
  translate_y_px: [-2, 2]
  component_apply_prob: 0.5

eval:
  verification:
    threshold_steps: 400   # grid size for best-threshold search in [0,1]

  one_shot:
    enabled: true
    num_trials: 320        # paper uses 320 one-shot validation tasks :contentReference[oaicite:10]{index=10}
    num_way: 20            # Omniglot evaluation is 20-way; good default analogue :contentReference[oaicite:11]{index=11}
    seed: 123
