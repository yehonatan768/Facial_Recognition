# =========================
# Paths
# =========================
paths:
  project_root: ""
  images_root: images
  pairs_train: assets/pairsDevTrain.txt
  pairs_test: assets/pairsDevTest.txt

# =========================
# Split strategy
# =========================
split:
  val_ratio: 0.3
  target_pos_frac: 0.50
  min_val_identities: 30
  seed: 42

# =========================
# Model
# =========================
model:
  # Use a stronger encoder to push accuracy >80% on small datasets.
  # Options: paper_cnn | resnet18
  encoder: resnet18
  in_channels: 1
  embedding_dim: 256           # 256-512 works well with L2 normalization
  enforce_input_size: true     # or keep enforce_105; train.py maps it

  activation: leaky_relu       # or relu
  embed_activation: none       # for L2 embeddings; "sigmoid" for strict paper
  l2_normalize: true
  l2_eps: 1e-12
  dropout_p: 0.15              # smaller for pretrained backbone

  # ResNet encoder controls
  resnet_pretrained: true
  resnet_freeze_backbone: false
  resnet_freeze_backbone_epochs: 5

  # ResNet options
  resnet_pretrained: true
  resnet_freeze_backbone: true
  resnet_freeze_backbone_epochs: 5

# =========================
# Optimization
# =========================
optim:
  # For pretrained backbones, AdamW typically converges faster and more stably.
  optimizer: adamw
  lr: 0.0002

  # Optional layer-wise learning rates
  lr_conv: 0.00005     # backbone
  lr_fc: 0.0002        # projection
  lr_alpha: 0.0002     # head

  weight_decay: 0.0001
  weight_decay_conv: 0.00005
  weight_decay_fc: 0.0002
  weight_decay_alpha: 0.0    # up from 0.0001

# =========================
# Data
# =========================
data:
  image_ext: .jpg
  strict_exists: true

# =========================
# Pipeline
# =========================
pipeline:
  mode: advanced  # paper | advanced

# =========================
# Transform (shared)
# =========================
transform:
  input_size: 160
  mean: 0.5
  std: 0.5

# =========================
# Deterministic filters (train/val/test)
# =========================
filters:
  equalize:
    enabled: true
    method: autocontrast     # autocontrast | equalize | clahe
    autocontrast_cutoff: 1.0
    autocontrast_ignore: null
    clahe_clip_limit: 2.0
    clahe_tile_grid_size: 8

  edge:
    enabled: true
    method: find_edges       # currently only find_edges
    mode: mix                # mix | edges_only
    alpha: 0.05              # keep small so texture still dominates
    blur_radius: 0.1         # mild smoothing to reduce edge noise

# =========================
# Advanced pipeline (FACE MASK)
# =========================
advanced:
  pre_crop_ratio: 0.95
  face_mask:
    center: [0.0, 0.0]
    axes: [0.75, 0.90]
    edge_softness: 0.12
    power: 1.0

# =========================
# Paper pipeline
# =========================
paper:
  enable_jitter: true
  jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.01

# =========================
# Train-only augmentations
# =========================
augment:
  hflip:
    enabled: true
    p: 0.5

  rotation:
    enabled: true
    degrees: 5.0

  blur:
    enabled: true
    p: 0.15
    kernel_size: 3
    sigma: [0.3, 1.0]

  random_erasing:
    enabled: true
    p: 0.10
    scale: [0.02, 0.08]
    ratio: [0.3, 3.3]
    value: 0.0

# =========================
# Training
# =========================
train:
  seed: 42
  epochs: 200
  batch_size: 64
  dump_every: 10


# =========================
# Early stopping
# =========================
early_stop:
  enabled: true
  monitor: val_best_thr_acc
  mode: max
  patience: 25
  min_delta: 0.0
