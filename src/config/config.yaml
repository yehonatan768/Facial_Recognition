# =========================
# Paths
# =========================
paths:
  project_root: ""            # auto-resolved by read_config.py
  images_root: images
  pairs_train: assets/pairsDevTrain.txt
  pairs_test: assets/pairsDevTest.txt

# =========================
# Optimization
# =========================
optim:
  lr: 0.001
  lr_decay: 0.985
  momentum_start: 0.5
  momentum_final: 0.85
  momentum_ramp_epochs: 40


# =========================
# Data
# =========================
data:
  image_ext: .jpg
  strict_exists: true

# =========================
# Pipeline
# =========================
pipeline:
  mode: advanced              # paper | advanced

# =========================
# Transform (shared)
# =========================
transform:
  input_size: 105
  mean: 0.5
  std: 0.5

# =========================
# Advanced pipeline (FACE MASK)
# =========================
advanced:
  pre_crop_ratio: 0.92

  face_mask:
    center: [0.0, 0.0]
    axes: [0.75, 0.90]
    edge_softness: 0.08
    power: 1.5

# =========================
# Paper pipeline (if used)
# =========================
paper:
  enable_jitter: true
  jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.01

# =========================
# Training
# =========================
train:
  seed: 42
  epochs: 200
  batch_size: 128
  dump_every: 10

# =========================
# Split strategy
# =========================
split:
  val_ratio: 0.25
  target_pos_frac: 0.50
  min_val_identities: 30
  seed: 42

# =========================
# Model
# =========================
model:
  in_channels: 1
  enforce_105: true
  embedding_dim: 4096

# =========================
# Early stopping
# =========================
early_stop:
  enabled: true
  monitor: val_acc          # val_acc | val_loss
  mode: max                 # max for acc, min for loss
  patience: 30
  min_delta: 0.0

augment:
  hflip:
    enabled: true
    p: 0.5

  rotation:
    enabled: true
    degrees: 4.0        # use 3.0–5.0 for “light rotation”

  blur:
    enabled: true
    p: 0.15
    kernel_size: 3
    sigma: [0.3, 1.0]   # min/max sigma

  random_erasing:
    enabled: false
    p: 0.10
    scale: [0.02, 0.08]
    ratio: [0.3, 3.3]
    value: 0.0
