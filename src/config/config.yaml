# =========================
# Paths
# =========================
paths:
  project_root: ""
  images_root: images
  pairs_train: assets/pairsDevTrain.txt
  pairs_test: assets/pairsDevTest.txt

# =========================
# Split strategy
# =========================
split:
  val_ratio: 0.20
  target_pos_frac: 0.50
  min_val_identities: 30
  seed: 42

# =========================
# Model
# =========================
model:
  # Options: paper_cnn | resnet18
  encoder: resnet18

  # IMPORTANT for pretrained ResNet: use RGB
  in_channels: 3

  # Embedding dim: 256 is fine; 512 often helps separability
  embedding_dim: 512

  # Use cosine head for L2 embeddings + fixed threshold stability
  head_type: cosine          # (requires the updated src I sent)
  cosine_scale_init: 10.0    # good starting scale
  cosine_learn_scale: true
  cosine_use_bias: true

  enforce_input_size: true
  activation: relu
  embed_activation: none

  l2_normalize: true
  l2_eps: 1.0e-12

  # Dropout: keep small; 0.0–0.1 usually best with pretrained backbones
  dropout_p: 0.05

  # ResNet options
  resnet_pretrained: true

  # Warmup head then fine-tune backbone
  resnet_freeze_backbone: true
  resnet_freeze_backbone_epochs: 2

# =========================
# Optimization
# =========================
optim:
  optimizer: adamw

  # Head/projection LR
  lr: 0.0003

  # Layer-wise LRs
  # Backbone LR should be ~10x smaller than head
  lr_conv: 0.00003
  lr_fc: 0.0003
  lr_alpha: 0.0003

  # Weight decay: modest
  weight_decay: 0.0002
  weight_decay_conv: 0.0001
  weight_decay_fc: 0.0002
  weight_decay_alpha: 0.0

  # Optional but often helps stability if your code supports it
  grad_clip_norm: 1.0

# =========================
# Data
# =========================
data:
  image_ext: .jpg
  strict_exists: true

# =========================
# Pipeline
# =========================
pipeline:
  mode: advanced   # paper | advanced

# =========================
# Transform (shared)
# =========================
transform:
  # ResNet works materially better at >=160 for face verification
  input_size: 160

  # Required by CenterCropMinSide(ratio=...)
  # 1.0 means "crop to min side" (square). 0.90–0.95 zooms in a bit.
  center_crop_ratio: 1.0

  # IMPORTANT for pretrained ResNet18 (ImageNet normalization)
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

# =========================
# Deterministic filters (train/val/test)
# =========================
# For pretrained ResNet, these usually hurt (distribution shift).
filters:
  equalize:
    enabled: false
    method: autocontrast
    autocontrast_cutoff: 1.0
    autocontrast_ignore: null
    clahe_clip_limit: 2.0
    clahe_tile_grid_size: 8

  edge:
    enabled: false
    method: find_edges
    mode: mix
    alpha: 0.05
    blur_radius: 0.1

# =========================
# Advanced pipeline (FACE MASK)
# =========================
advanced:
  # If you already have good alignment/crops, keep pre_crop_ratio disabled
  pre_crop_ratio: 0.0

  # Mask can help if background is very inconsistent.
  # If your faces are already tight crops, set enabled=false (if supported) or loosen axes.
  face_mask:
    center: [0.0, 0.0]
    axes: [0.80, 0.95]
    edge_softness: 0.10
    power: 1.0

# =========================
# Paper pipeline
# =========================
paper:
  enable_jitter: false
  jitter:
    brightness: 0.0
    contrast: 0.0
    saturation: 0.0
    hue: 0.0

# =========================
# Train-only augmentations
# =========================
augment:
  hflip:
    enabled: true
    p: 0.5

  rotation:
    enabled: true
    degrees: 3.0

  blur:
    enabled: false
    p: 0.10
    kernel_size: 3
    sigma: [0.2, 0.8]

  random_erasing:
    enabled: false
    p: 0.05
    scale: [0.02, 0.06]
    ratio: [0.3, 3.3]
    value: 0.0

# =========================
# Training
# =========================
train:
  seed: 42
  epochs: 80
  batch_size: 64
  dump_every: 10

# =========================
# Early stopping
# =========================
early_stop:
  enabled: true
  # You said you want val accuracy to improve at fixed threshold.
  # So monitor val_acc (threshold=0.5), not best-threshold metrics.
  monitor: val_acc
  mode: max
  patience: 30
  min_delta: 0.002
