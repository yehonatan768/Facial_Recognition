train:
  device: cuda
  max_epochs: 200
  seed: 42
  deterministic: false

  early_stop:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 20
    min_delta: 0.0

# Put split at TOP LEVEL so train.py always sees it
split:
  val_ratio: 0.25
  target_pos_frac: 0.5
  min_val_identities: 30
  seed: 42

# DataLoader performance knobs (TOP LEVEL so datasets.py can read cfg["data"])
# For fastest startup while debugging, use num_workers=0.
data:
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
