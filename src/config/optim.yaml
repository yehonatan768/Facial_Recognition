optim:
  name: "sgd"
  batch_size: 64
  lr_decay: 0.993                # multiplicative decay per epoch (exponential schedule)
  momentum_start: 0.5
  momentum_ramp_epochs: 20      # linear ramp from momentum_start to momentum_target
  # Layer-wise hyperparameters (eta_j, mu_j, lambda_j)
  # If you do not want layer-wise control, set all lrs/momentums/weight_decays equal.
  layerwise:
    conv1: {lr: 0.01, momentum_target: 0.9, weight_decay: 0.0005}
    conv2: {lr: 0.01, momentum_target: 0.9, weight_decay: 0.0005}
    conv3: {lr: 0.01, momentum_target: 0.9, weight_decay: 0.0005}
    conv4: {lr: 0.01, momentum_target: 0.9, weight_decay: 0.0005}
    fc:    {lr: 0.01, momentum_target: 0.9, weight_decay: 0.0005}
    head:  {lr: 0.01, momentum_target: 0.9, weight_decay: 0.0005}
